<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Motorcycle Mayhem</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;color:white;font-family:system-ui;overflow:hidden;touch-action:none}canvas{display:block}#hud{position:fixed;top:12px;left:12px;font-size:17px;font-weight:900;text-shadow:0 2px 5px black}#hud b{color:#ffd24c}#pause{position:fixed;right:12px;top:12px}button{border:0;border-radius:12px;padding:14px 20px;background:#ffce35;color:#161616;font-size:18px;font-weight:900}#controls{position:fixed;bottom:15px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none}#controls div{display:flex;gap:9px}#controls button{pointer-events:auto;min-width:65px;min-height:65px;color:white;background:#ffffff55;border:2px solid #ffffff88;touch-action:none}#controls button:active{background:#ffce35;color:black}#overlay{position:fixed;inset:0;background:#10131de8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px;z-index:3}h1{font-size:clamp(32px,8vw,65px);color:#ffce35;line-height:1;margin:0}p{max-width:450px;line-height:1.5}#pop{position:fixed;top:33%;width:100%;text-align:center;font-size:30px;color:#ffe36e;font-weight:900;text-shadow:0 2px 8px #000;pointer-events:none}
</style></head><body><div id="hud">DAMAGE <b id="score">0</b><br>COMBO <b id="combo">x1</b><br>RIDER HP <b id="health">100</b>%<br><span id="wanted"></span><br>SPEED <b id="speed">110</b> km/h</div><button id="pause">Ⅱ</button><div id="pop"></div><div id="controls"><div><button data-key="left">◀</button><button data-key="right">▶</button></div><div><button data-key="brake">BRAKE</button><button data-key="gas">GAS</button></div></div><div id="overlay"><h1>MOTORCYCLE<br>MAYHEM</h1><p>Sideswipe traffic for points! Oncoming cars pay extra. Send cars into roadside obstacles, escape police, and avoid head-on or rear-end crashes.</p><p>Phone: touch controls. Keyboard: WASD or arrow keys.</p><button id="play">RIDE!</button></div>
<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new T.Scene();scene.background=new T.Color(0x89b5d5);scene.fog=new T.Fog(0x89b5d5,65,240);
const camera=new T.PerspectiveCamera(70,innerWidth/innerHeight,.1,350),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));document.body.prepend(renderer.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x536070,2));const sun=new T.DirectionalLight(0xffffff,2);sun.position.set(-20,60,10);scene.add(sun);
const material=c=>new T.MeshStandardMaterial({color:c,roughness:.8});const asphalt=material(0x30343a),grass=material(0x528357),white=material(0xf7e4a1),steel=material(0x9ca4aa),rubber=material(0x171717);
function cube(w,h,d,m,x=0,y=0,z=0,parent=scene){const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);parent.add(o);return o}
cube(400,.1,900,grass,0,-.17,-200);cube(24,.12,900,asphalt,0,-.08,-200);for(let x of [-12,12])cube(.4,.55,900,steel,x,.23,-200);
cube(.3,.03,900,material(0xffd746),0,.025,-200);const lines=[];for(let z=-390;z<50;z+=16)for(let x of [-6,0,6])lines.push(cube(.22,.02,7,white,x,.01,z));
function wheel(parent,x,z,r=.47){const o=new T.Mesh(new T.TorusGeometry(r,.16,8,14),rubber);o.position.set(x,r+.1,z);parent.add(o)}
const bike=new T.Group();scene.add(bike);cube(.68,.48,2.4,material(0xffca2c),0,1.1,0,bike);wheel(bike,0,-1.02);wheel(bike,0,1.02);cube(.83,.9,.55,material(0x2871d5),0,1.56,.22,bike);const helmet=new T.Mesh(new T.SphereGeometry(.44,12,10),material(0x1a2027));helmet.position.set(0,2.14,.18);bike.add(helmet);
const obstacles=[];for(let z=-350;z<65;z+=42)for(let side of [-1,1]){const pole=cube(.35,9,.35,material(0x7b6754),side*15,4.4,z);obstacles.push(pole)}const billboards=[];for(let z=-340;z<65;z+=105){let side=(Math.floor(z/105)%2?1:-1),g=new T.Group();scene.add(g);cube(.35,7,.35,steel,0,3.5,0,g);cube(9,4,.4,material(0x24487b),0,8,0,g);const canvas=document.createElement("canvas");canvas.width=512;canvas.height=256;const ctx=canvas.getContext("2d");ctx.fillStyle="#193b72";ctx.fillRect(0,0,512,256);ctx.fillStyle="#ffdd62";ctx.font="bold 54px sans-serif";ctx.textAlign="center";ctx.fillText("YOUR BRAND",256,112);ctx.font="bold 32px sans-serif";ctx.fillStyle="white";ctx.fillText("HERE",256,166);const face=new T.Mesh(new T.PlaneGeometry(8.8,3.8),new T.MeshBasicMaterial({map:new T.CanvasTexture(canvas),side:T.DoubleSide}));face.position.set(0,8,.24);g.add(face);g.position.set(side*22,0,z);billboards.push(g)}function makeCar(){const truck=Math.random()<.18,w=truck?3.5:2.6,l=truck?7.6:5.1,h=truck?2.5:1.25,g=new T.Group();scene.add(g);const colors=[0xd94739,0x4a86d8,0xe8e8dc,0x4ca679,0xf3ae3c,0x9c83bd];cube(w,h,l,material(colors[Math.random()*colors.length|0]),0,1+h/2,0,g);cube(w*.82,.8,l*.45,material(0x80a4b9),0,1+h,l*.05,g);for(let x of [-w/2,w/2])for(let z of [-l*.32,l*.32])wheel(g,x,z,.43);const lane=[-9,-3,3,9][Math.random()*4|0],oncoming=lane<0;g.position.set(lane,0,oncoming?-175:-175);if(oncoming)g.rotation.y=Math.PI;return {g,w,l,v:12+Math.random()*17,hp:truck?3:2,crashed:false,vx:0,spin:0,life:0,oncoming,scored:false,police:false}}
let cars=[],debris=[],score=0,combo=1,comboTimer=0,health=100,speed=110,spawn=0,playing=false,paused=false,popTimer=0,wanted=0,policeTimer=0,escapeTimer=0,crashTimer=0,ragVelocity=0;const keys={};const clock=new T.Clock();
const $=id=>document.getElementById(id);const rider=new T.Group();scene.add(rider);const riderHead=new T.Mesh(new T.SphereGeometry(.43,10,10),material(0x20232a));rider.add(riderHead);cube(.7,1,.45,material(0x2c72d4),0,-.65,0,rider);rider.visible=false;function popup(s){$('pop').textContent=s;popTimer=1}
function reset(){for(let c of cars)scene.remove(c.g);cars=[];for(let d of debris)scene.remove(d.o);debris=[];score=0;combo=1;comboTimer=0;health=100;speed=110;spawn=0;wanted=0;policeTimer=0;escapeTimer=0;crashTimer=0;rider.visible=false;bike.visible=true;playing=true;paused=false;bike.position.set(0,0,8);$('overlay').style.display='none';$('pause').textContent='Ⅱ'}
$('play').onclick=reset;$('pause').onclick=()=>{if(playing){paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ'}};
const mapping={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'gas',ArrowDown:'brake',a:'left',d:'right',w:'gas',s:'brake'};addEventListener('keydown',e=>{if(mapping[e.key]){keys[mapping[e.key]]=true;e.preventDefault()}});addEventListener('keyup',e=>{if(mapping[e.key])keys[mapping[e.key]]=false});document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{keys[k]=true;b.setPointerCapture(e.pointerId)});for(let n of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(n,()=>keys[k]=false)});
function award(n,label){const points=Math.round(n*combo*(wanted>0?2:1));score+=points;combo=Math.min(12,combo+1);comboTimer=3;popup(label+" +"+points)}function witness(){if(wanted>0)return;const chance=Math.random();if(chance<.45){wanted=13;policeTimer=1.4;escapeTimer=0;popup("POLICE WITNESS! 2X DAMAGE")}}function crash(c,chain=false){if(c.crashed)return;c.hp--;if(c.hp>0&&!chain){c.vx+=(c.g.position.x-bike.position.x)*2.5;award(c.oncoming?150:75,"SIDESWIPE");witness();return}c.crashed=true;c.life=3.5;c.vx=(c.g.position.x-bike.position.x)*5+(Math.random()-.5)*7;c.spin=(Math.random()-.5)*5;award((chain?320:220)*(c.oncoming?2:1),chain?"CHAIN CRASH":"WRECK");if(!chain)witness();for(let i=0;i<7;i++){const o=cube(.2,.2,.3,material(i%2?0xf3a13b:0x444444),c.g.position.x,1.5,c.g.position.z);debris.push({o,v:new T.Vector3((Math.random()-.5)*13,Math.random()*8,(Math.random()-.5)*12),life:1.2})}}
function eject(){if(crashTimer>0)return;health-=34;crashTimer=1.7;rider.visible=true;bike.visible=false;rider.position.copy(bike.position);rider.position.y=2.4;ragVelocity=12;popup("RIDER EJECTED! -34 HP");if(health<=0){health=0}}function finish(){playing=false;$('overlay').style.display='flex';document.querySelector('h1').innerHTML='RIDE OVER';document.querySelector('#overlay p').innerHTML='Damage score: <strong>'+score.toLocaleString()+'</strong><br>Try again for a bigger pileup!';$('play').textContent='RIDE AGAIN'}
function tick(){requestAnimationFrame(tick);const dt=Math.min(.045,clock.getDelta());if(playing&&!paused){if(keys.gas)speed=Math.min(190,speed+70*dt);else if(keys.brake)speed=Math.max(35,speed-130*dt);else speed+=(110-speed)*dt*.4;const steer=(keys.right?1:0)-(keys.left?1:0);bike.position.x=T.MathUtils.clamp(bike.position.x+steer*(6+speed*.035)*dt,-11,11);bike.rotation.z=T.MathUtils.lerp(bike.rotation.z,-steer*.24,dt*8);if(crashTimer>0){crashTimer-=dt;ragVelocity-=20*dt;rider.position.y=Math.max(.5,rider.position.y+ragVelocity*dt);rider.position.z-=speed*.06*dt;rider.rotation.x+=dt*9;if(crashTimer<=0){rider.visible=false;bike.visible=true;bike.position.x=T.MathUtils.clamp(bike.position.x+(bike.position.x<0?-1:1)*1.5,-10,10);if(health<=0)finish()}}for(let l of lines){l.position.z+=speed*.19*dt;if(l.position.z>45)l.position.z-=448}for(let o of obstacles){o.position.z+=speed*.19*dt;if(o.position.z>50)o.position.z-=420}for(let o of billboards){o.position.z+=speed*.19*dt;if(o.position.z>60)o.position.z-=420}spawn-=dt;if(spawn<=0){cars.push(makeCar());spawn=Math.max(.4,1.1-score/80000)+Math.random()*.45}for(let c of cars){c.g.position.z+=(speed+(c.oncoming?c.v:-c.v))*.19*dt;c.g.position.x+=c.vx*dt;c.vx*=Math.pow(.93,dt*60);if(c.crashed){c.g.rotation.y+=c.spin*dt;c.g.rotation.z+=c.spin*dt*.25;c.life-=dt;for(let o of obstacles)if(Math.abs(c.g.position.z-o.position.z)<2.5&&Math.abs(c.g.position.x-o.position.x)<2&&!c.scored){c.scored=true;award(550,"POLE SMASH")}}else if(crashTimer<=0&&Math.abs(c.g.position.z-bike.position.z)<c.l/2+1.2&&Math.abs(c.g.position.x-bike.position.x)<c.w/2+.52){const dz=Math.abs(c.g.position.z-bike.position.z),dx=Math.abs(c.g.position.x-bike.position.x);if(dx>c.w*.32&&dz<c.l*.48){crash(c);c.vx+=(c.g.position.x>bike.position.x?1:-1)*8;bike.position.x=T.MathUtils.clamp(bike.position.x+(c.g.position.x>bike.position.x?-1:1)*.7,-11,11)}else eject()}if(!c.crashed&&Math.abs(c.g.position.x)>12){crash(c,true);award(450,"OFF ROAD")}if(c.crashed)for(let other of cars)if(other!==c&&!other.crashed&&Math.abs(c.g.position.z-other.g.position.z)<(c.l+other.l)/2&&Math.abs(c.g.position.x-other.g.position.x)<(c.w+other.w)/2)crash(other,true)}cars=cars.filter(c=>{if(c.g.position.z>50||c.g.position.z< -230||(c.crashed&&c.life<0)){scene.remove(c.g);return false}return true});for(let d of debris){d.life-=dt;d.v.y-=19*dt;d.o.position.addScaledVector(d.v,dt);d.o.rotation.x+=dt*8}debris=debris.filter(d=>{if(d.life<=0){scene.remove(d.o);return false}return true});if(wanted>0){wanted-=dt;policeTimer-=dt;escapeTimer+=dt;if(policeTimer<=0){policeTimer=2.5;popup("SIRENS! 2X POINTS")}if(wanted<=0){wanted=0;award(1200,"POLICE ESCAPED");escapeTimer=0}}$("wanted").textContent=wanted>0?"🚨 PURSUIT 2X "+Math.ceil(wanted)+"s":"";if(comboTimer>0)comboTimer-=dt;else combo=1;if(popTimer>0)popTimer-=dt;else $('pop').textContent='';$('score').textContent=score.toLocaleString();$('combo').textContent='x'+combo;$('health').textContent=Math.max(0,Math.round(health));$('speed').textContent=Math.round(speed)}camera.position.lerp(new T.Vector3(bike.position.x*.55,7.4,20),.1);camera.lookAt(bike.position.x*.7,1,-24);renderer.render(scene,camera)}bike.position.z=8;tick();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
