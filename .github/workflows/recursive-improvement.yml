name: Recursive game improvement
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recursive-improvement.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'
permissions:
  contents: write
  models: read
concurrency:
  group: motorcycle-improvement-bot
  cancel-in-progress: false
jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bot/recursive-improvements
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure bot identity
        run: |
          git config user.name "motorcycle-improvement-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Make one reviewed-by-checks improvement
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/recursive_improve.py
